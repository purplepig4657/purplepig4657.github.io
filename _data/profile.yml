short_bio_text_justify: false
short_bio: >-
  <p>
    I am an M.S. student at the <a href="https://ml.postech.ac.kr/" target="_blank">Machine Learning Lab</a> at POSTECH.
  </p>

  <p>
    I am currently working on <b>large model optimization</b>, advised by
    <a href="https://sites.google.com/view/eh-p/home" target="_blank">Eunhyeok Park</a>.
    My recent research interests include developing more effective methods for
    Parameter-Efficient Fine-Tuning (PEFT), as well as improving the efficiency of
    large model inference.
    More broadly, I am interested in understanding and exploiting low-dimensional
    structures in large language models to make both training and inference more efficient.
    I am particularly interested in methods that reduce computational and memory costs
    while preserving model performance.
  </p>



# <p>
